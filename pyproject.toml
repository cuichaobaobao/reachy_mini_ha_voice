[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reachy_mini_ha_voice"
version = "0.4.0"
description = "Home Assistant Assist voice satellite with Reachy Mini gestures"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
keywords = ["reachy-mini-app", "home-assistant"]
dependencies = [
  "reachy-mini>=1.12.0,<1.13", "websockets==12",
  "aioesphomeapi==45.3.1; sys_platform == 'linux'",
  "netifaces2==0.0.22; sys_platform == 'linux'",
  "numpy>=2,<3",
  "pymicro-wakeword>=2,<3; sys_platform == 'linux'",
  "pyopen-wakeword>=1,<2; sys_platform == 'linux'",
  "zeroconf<1",
  "getmac<1; sys_platform == 'linux'", "types-protobuf; sys_platform == 'linux'",
  "webrtc-noise-gain>=1,<2; sys_platform == 'linux'"
]

[project.entry-points."reachy_mini_apps"]
reachy_mini_ha_voice = "reachy_mini_ha_voice.main:ReachyMiniHaVoice"

[project.optional-dependencies]
test = ["pytest>=8", "ruff", "build"]

[tool.setuptools.packages.find]
include = ["reachy_mini_ha_voice*"]
namespaces = false

[tool.setuptools.package-data]
reachy_mini_ha_voice = ["vendor/**/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
exclude = ["reachy_mini_ha_voice/vendor"]
