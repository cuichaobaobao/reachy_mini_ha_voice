name: Test and package
on: [push, pull_request, workflow_dispatch]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use Ubuntu archive for system dependencies
        run: |
          sudo find /etc/apt -type f \( -name '*.list' -o -name '*.sources' -o -name 'apt-mirrors*.txt' \) -exec sed -i -E 's|https?://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' {} +
      - run: sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 update && sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 install -y libasound2-dev libcairo2-dev libgirepository1.0-dev gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 gstreamer1.0-alsa gstreamer1.0-plugins-good gstreamer1.0-libav
      - name: Ensure libmpv is absent (Wireless startup regression)
        run: sudo apt-get purge -y libmpv2 libmpv-dev mpv
      - uses: astral-sh/setup-uv@v6
      - run: uv pip install --system -e '.[test]'
      - run: python -m pytest -q
      - run: ruff check reachy_mini_ha_voice tests
      - run: python -m build
      - run: reachy-mini-app-assistant check .
      - name: Test SDK audio without PulseAudio and real ESPHome runtime
        run: |
          python scripts/smoke_wake_sound.py
          python scripts/smoke_linux.py
          python scripts/smoke_tts.py
          python scripts/smoke_direction.py
          python scripts/smoke_motion_link.py
  release:
    # A version in pyproject.toml without a matching vX.Y.Z tag is published from
    # main only after the full Linux suite above has passed. Other pushes only test.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: linux
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Find unreleased version
        id: version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released; nothing to publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Sync Hugging Face Space
        if: steps.version.outputs.publish == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install 'huggingface_hub>=2,<3'
          python scripts/sync_hf_space.py "${{ steps.version.outputs.tag }}"
      - name: Tag and create GitHub release from CHANGELOG
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          awk -v v="## ${TAG#v}" '$0 == v {found=1; print; next} found && /^## / {exit} found' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG section for $TAG"; exit 1; }
          printf '\n完整记录见 [CHANGELOG.md](https://github.com/%s/blob/main/CHANGELOG.md)。\n' "$GITHUB_REPOSITORY" >> notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
