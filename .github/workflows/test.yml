name: Test and package
on: [push, pull_request, workflow_dispatch]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use Ubuntu archive for system dependencies
        run: sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
      - run: sudo apt-get update && sudo apt-get install -y libmpv-dev libpulse0 pulseaudio libcairo2-dev libgirepository1.0-dev gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 gstreamer1.0-pulseaudio gstreamer1.0-plugins-good gstreamer1.0-libav
      - uses: astral-sh/setup-uv@v6
      - run: uv pip install --system -e '.[test]'
      - run: python -m pytest -q
      - run: ruff check reachy_mini_ha_voice tests
      - run: python -m build
      - run: reachy-mini-app-assistant check .
      - name: Start virtual audio and test real ESPHome runtime
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=reachy_test
          pactl set-default-sink reachy_test
          pactl set-default-source reachy_test.monitor
          python scripts/smoke_linux.py
          python scripts/smoke_tts.py
          python scripts/smoke_direction.py
